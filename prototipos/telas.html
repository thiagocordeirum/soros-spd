<title>Telas da logística de soros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Space+Grotesk:wght@500..700&display=swap">
<style>
/* Layout: barra de papéis no topo; à esquerda a tela (celular para o posto, painel para polo/central), à direita a ficha com os requisitos que a tela atende. Mesma identidade do deck. */
:root{
  --bg:#EDE7DA; --surface:#F8F6F0; --card:#FFFDF8; --line:#D9D2C2;
  --ink:#1D2B28; --ink-2:#3D4A47; --ink-3:#5E6A66;
  --forest:#10302C; --forest-2:#173D38; --on-forest:#F5F1E8; --on-forest-2:#C9D6D1;
  --accent:#F08A4B; --accent-ink:#1D1A16; --rust:#A9441A;
  --ok:#1F5C43; --ok-bg:#DCEBE3; --warn-bg:#FBE6D8; --warn-line:#F1C7A8;
  --bad:#A32D1F; --bad-bg:#F6DAD4; --muted-bg:#ECE6D8;
  --display:'Space Grotesk', 'Arial Narrow', Arial, sans-serif;
  --body:'DM Sans', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A18; --surface:#16231F; --card:#1C2B27; --line:#2E3F3A;
  --ink:#ECE7DC; --ink-2:#C4CCC7; --ink-3:#93A29C;
  --forest:#0A2420; --forest-2:#123430; --on-forest:#F5F1E8; --on-forest-2:#B5C6C0;
  --accent:#F29A62; --accent-ink:#1D1A16; --rust:#F0905E;
  --ok:#8FD3B0; --ok-bg:#1D3A2E; --warn-bg:#3A2A1E; --warn-line:#6B4630;
  --bad:#F2A091; --bad-bg:#3E231E; --muted-bg:#22312C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A18; --surface:#16231F; --card:#1C2B27; --line:#2E3F3A;
  --ink:#ECE7DC; --ink-2:#C4CCC7; --ink-3:#93A29C;
  --forest:#0A2420; --forest-2:#123430; --on-forest:#F5F1E8; --on-forest-2:#B5C6C0;
  --accent:#F29A62; --accent-ink:#1D1A16; --rust:#F0905E;
  --ok:#8FD3B0; --ok-bg:#1D3A2E; --warn-bg:#3A2A1E; --warn-line:#6B4630;
  --bad:#F2A091; --bad-bg:#3E231E; --muted-bg:#22312C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;color:var(--ink)}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* topo */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:24px;font-weight:600}
.brand p{color:var(--ink-3);font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;background:var(--muted-bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:8px 14px;border-radius:9px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--on-forest)}
.net{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:12px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.net[data-off="true"] .dot{background:var(--rust)}

/* área principal */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.notes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.notes h2{font-size:19px}
.notes .lead{color:var(--ink-2)}
.reqs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.reqs li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;font-size:14px;color:var(--ink-2)}
.tick{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.tag{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--rust);background:var(--warn-bg);border-radius:6px;padding:2px 6px;align-self:start;text-align:center}
.tag.nf{color:var(--ok);background:var(--ok-bg)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* celular */
.phone-area{display:flex;justify-content:center}
.phone{width:min(390px,100%);background:#16211F;border-radius:44px;padding:12px;box-shadow:0 26px 60px rgba(16,48,44,.28)}
.screen{background:var(--surface);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;height:760px}
.shead{background:var(--forest);color:var(--on-forest);padding:22px 20px 16px;display:flex;flex-direction:column;gap:6px}
.shead .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shead .unit{color:var(--on-forest-2);font-size:14px}
.shead h2{color:var(--on-forest);font-size:26px;font-weight:600}
.shead .sub{color:var(--on-forest-2);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.off{background:var(--accent);color:var(--accent-ink)}
.pill.on{background:#2E7D5B;color:#F5F1E8}
.sbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card)}
.tabs button{border:0;background:transparent;color:var(--ink-3);padding:10px 2px 12px;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--forest)}
:root[data-theme="dark"] .tabs button[aria-current="page"]{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button[aria-current="page"]{color:var(--accent)}}
.badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--rust);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.focus{border:2px solid var(--accent)}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.card.bad{background:var(--bad-bg);border-color:var(--bad)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{font-size:16px;font-weight:600}
.big{font-family:var(--display);font-size:26px;font-weight:700}
.small{font-size:13px;color:var(--ink-3)}
.lot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:6px}
.lot button{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:8px;padding:2px 8px;font-size:12px}
.chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--rust)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.muted{background:var(--muted-bg);color:var(--ink-3)}
.btn{border:0;background:var(--forest);color:var(--on-forest);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center}
.btn.alt{background:transparent;color:var(--forest);border:1.5px solid var(--forest)}
:root[data-theme="dark"] .btn.alt{color:var(--on-forest);border-color:var(--on-forest-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.alt{color:var(--on-forest);border-color:var(--on-forest-2)}}
.btn.small{padding:7px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-3)}
.field select,.field input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--ink-2);background:var(--muted-bg);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--forest);color:var(--on-forest);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(560px, calc(100vw - 32px));z-index:10}
.sheet{display:flex;flex-direction:column;gap:10px;background:var(--card);border:2px solid var(--forest);border-radius:16px;padding:14px}

/* painel desktop */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0;box-shadow:0 18px 44px rgba(16,48,44,.14)}
.pbar{background:var(--muted-bg);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pbar .title{font-weight:700;color:var(--ink-2)}
.pnav{display:flex;gap:6px;flex-wrap:wrap}
.pnav button{border:0;background:transparent;color:var(--ink-2);padding:6px 10px;border-radius:8px;font-weight:600}
.pnav button[aria-current="page"]{background:var(--forest);color:var(--on-forest)}
.pbody{padding:18px;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:26px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.bar{height:8px;background:var(--muted-bg);border-radius:99px;overflow:hidden;min-width:90px}
.bar span{display:block;height:100%;background:var(--forest-2)}
.bar span.hi{background:var(--rust)}
.section-h{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.section-h h3{font-size:18px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
.chart svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.copybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre;overflow-x:auto;color:var(--ink-2)}
@media (prefers-reduced-motion: no-preference){.toast{animation:pop .25s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Telas da logística de soros</h1>
      <p>Protótipo navegável com dados de exemplo. Ao lado de cada tela, o que ela cobre.</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Quem está usando">
        <button id="role-posto" data-role="posto" aria-pressed="true">Posto</button>
        <button id="role-polo" data-role="polo" aria-pressed="false">Polo</button>
        <button id="role-central" data-role="central" aria-pressed="false">Central</button>
      </div>
      <button class="net" id="net" data-off="true" aria-pressed="false"><span class="dot"></span><span id="net-label">Sem conexão</span></button>
    </div>
  </header>
  <main class="stage">
    <div id="view"></div>
    <aside class="notes" id="notes" aria-live="polite"></aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- Dados de exemplo (cenário do protótipo, valores ilustrativos) ----------
const HOJE = new Date(2026, 9, 27); // 27/10/2026
const SOROS = {SAB:'Antibotrópico', SABL:'Antibotrópico-laquético', SAEsc:'Antiescorpiônico', SAEl:'Antielapídico', SAAr:'Antiaracnídico'};
const AGRAVOS = [

const S = {

  fila:[ {hora:'25/10 14:10', agravo:'Serpente (jararaca)', amp:4}, {hora:'26/10 08:35', agravo:'Escorpião', amp:3}, {hora:'27/10 06:50', agravo:'Serpente (jararaca)', amp:8} ],
  enviados:41,

  // visão regional (o que o polo sabe); idade em horas
  regiao:[
    {nome:'Tabatinga', tipo:'polo', sab:92, total:182, cap:400, idade:0, transito:0},

  enviadosPolo:[],
};
// Rotas a partir de Atalaia (tempo em horas, idade do dado em horas)
const ROTAS = [
  {destino:'Benjamin Constant', h:1.0, caminho:'estrada', sab:20, sabl:10, idade:7},
  {destino:'Tabatinga (polo)', h:1.5, caminho:'estrada + voadeira', sab:92, sabl:52, idade:2},
  {destino:'Manaus (central)', h:3.5, caminho:'estrada + voadeira + avião', sab:2524, sabl:300, idade:2},
  {destino:'São Paulo de Olivença', h:5.5, caminho:'estrada + voadeira', sab:24, sabl:20, idade:28},
];
// Casos por dia na região (dados de exemplo para a vigilância)
const SERIE = {'Alto Solimões':[1,2,1,0,2,1,2,1,1,2,4,7], 'Médio Solimões':[1,0,1,1,0,2,1,0,1,1,0,1]};
const CRITICOS = [ // análise N-1, valores de exemplo
  {posto:'Tabatinga (polo)', com:38}, {posto:'Benjamin Constant', com:21}, {posto:'Tefé (polo)', com:17},
  {posto:'São Paulo de Olivença', com:9}, {posto:'Atalaia do Norte', com:6}, {posto:'Uarini', com:4}, {posto:'Alvarães', com:2},
];
const PEA = [
  ['Tabatinga','Polo com armazenamento','SAB, SABL, SAEsc, SAEl'],['Benjamin Constant','Posto com armazenamento','SAB, SABL, SAEsc'],
  ['Atalaia do Norte','Posto com armazenamento','SAB, SABL, SAEsc'],['São Paulo de Olivença','Posto com armazenamento','SAB, SABL, SAEsc'],
  ['Tefé','Polo com armazenamento','SAB, SABL, SAEsc, SAEl'],['Alvarães','Posto com armazenamento','SAB, SABL, SAEsc'],['Uarini','Posto com armazenamento','SAB, SABL, SAEsc'],
];

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmaa = d => String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2);
const dias = d => Math.round((d - HOJE)/86400000);
const idadeTxt = h => h < 1 ? 'agora' : h < 48 ? `há ${Math.round(h)} h` : `há ${(h/24).toFixed(1).replace('.',',')} dias`;
const horasTxt = h => { const H=Math.floor(h), M=Math.round((h-H)*60); return M ? `${H}h${String(M).padStart(2,'0')}` : `${H}h`; };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 3200); }
function disponivel(l){ return !l.bloq && dias(l.val) >= 0 && l.qtd > 0; }
function saldo(soro){ return S.lotes.filter(l=>l.soro===soro && disponivel(l)).reduce((a,l)=>a+l.qtd,0); }
function fefo(soro){ return S.lotes.filter(l=>l.soro===soro && disponivel(l)).sort((a,b)=>a.val-b.val); }
const ICON = {
  estoque:'<path d="M4 7l8-4 8 4v10l-8 4-8-4z M4 7l8 4 8-4 M12 11v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  atender:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  rota:'<path d="M5 19c4 0 4-6 8-6s3-6 6-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="5" cy="19" r="2" fill="currentColor"/><circle cx="19" cy="5" r="2" fill="currentColor"/>',
  alertas:'<path d="M12 4l9 16H3z M12 10v4 M12 17v.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>',
  sync:'<path d="M20 12a8 8 0 0 1-14 5M4 12a8 8 0 0 1 14-5M18 3v4h-4M6 21v-4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
};

// ---------- Fichas de requisitos por tela ----------
const NOTAS = {
  'posto:estoque':{t:'Estoque do posto', d:'O profissional vê o que tem na geladeira, por soro e lote. O lote que vence antes aparece primeiro e é o que sai. Remessa que chegou é confirmada aqui.',
    r:['Entrada de lote com número, soro e validade','Saída pelo lote que vence antes','Lote vencido fica bloqueado; aviso de lote a vencer','Confirmação de recebimento da remessa','Estado da conexão sempre visível']},
  'posto:atender':{t:'Registrar atendimento', d:'Um formulário só para o caso e a saída do soro. O sistema não sugere dose: o profissional informa quantas ampolas aplicou, conforme o protocolo.',
    r:['Caso sem dado pessoal, ligado à saída do soro','Saída automática pelo lote certo','Caso guardado no aparelho até sincronizar','Funciona sem internet']},
  'posto:rota':{t:'Onde tem soro', d:'Se faltar soro, mostra os lugares com estoque suficiente, do mais rápido para o mais lento, e há quanto tempo cada estoque foi informado.',
    r:['Lugares com soro suficiente, do mais rápido ao mais lento','Há quanto tempo cada estoque foi informado','Destinos acima de 6 horas marcados']},
  'posto:alertas':{t:'Alertas da região', d:'O alerta de surto chega só para a região afetada. Quem está sem conexão recebe quando sincronizar.',
    r:['Alerta de surto só para a região afetada','Chega quando o posto sincroniza','A região em alerta recebe mais soro']},
  'posto:sync':{t:'Sincronização', d:'Mostra o que ainda não saiu do aparelho e quando foi a última troca de dados. Com conexão, a troca é automática; o botão força na hora.',

function abas(){

function telaEstoque(){

function previaAtendimento(){
  const ag = AGRAVOS.find(a=>a.id===$('#c-agravo').value), amp = +$('#c-amp').value || 0;
  const op = ag.soros.find(s=>saldo(s)>=amp);
  const prev = $('#c-prev'), bt = $('#c-salvar');
  if(amp===0){ prev.innerHTML='Sem soro neste atendimento: só o caso será notificado.'; bt.textContent='Salvar atendimento'; bt.dataset.semSoro=''; return; }
  if(op){ const l=fefo(op)[0]; prev.innerHTML=`Sai do lote <b>${l.id}</b> de ${SOROS[op]} (vence ${mmaa(l.val)}). Ficam ${saldo(op)-amp} amp.`; bt.textContent='Salvar atendimento'; delete bt.dataset.semSoro; }
  else { prev.innerHTML=`Não há ${ag.soros.map(s=>SOROS[s]).join(' nem ')} suficiente aqui (${amp} amp.). Salve o caso e veja onde tem soro.`; bt.textContent='Salvar e ver onde tem soro'; bt.dataset.semSoro='1'; }
}
function salvarAtendimento(e){
  e.preventDefault();
  const ag = AGRAVOS.find(a=>a.id===$('#c-agravo').value), amp = +$('#c-amp').value || 0;
  const op = amp ? ag.soros.find(s=>saldo(s)>=amp) : null;
  if(op){ let resto=amp; for(const l of fefo(op)){ const u=Math.min(l.qtd,resto); l.qtd-=u; resto-=u; if(!resto) break; } }
  const agora = new Date(); const hora = `27/10 ${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;
  S.fila.push({hora, agravo:ag.nome, amp: op?amp:0});
  if(S.online){ enviarFila(); toast('Atendimento salvo e enviado.'); } else toast('Atendimento salvo neste aparelho. Vai para a central na próxima sincronização.');
  if(amp && !op){ S.postoTab='rota'; S.rotaAmp=amp; S.rotaSoros=ag.soros; }
  else S.postoTab='estoque';
  render();
}

function alvo(u){ const base = u.tipo==='polo'?120:40; return S.alertas.some(a=>a.regiao==='Alto Solimões') ? base*2 : base; }
function sugestao(u){
  if(u.tipo==='polo') return null;
  const visto = u.sab + u.transito, a = alvo(u), livre = u.cap - u.total - u.transito;
  if(u.transito > 0 && u.idade > 24) return {qtd:0, motivo:'aguardando confirmação da remessa anterior'};
  if(visto >= a*0.5) return {qtd:0, motivo:'estoque suficiente'};
  return {qtd:Math.max(0, Math.min(a - visto, livre)), motivo: a-visto > livre ? 'limitado pelo espaço livre' : 'até o estoque-alvo'};
}

function grafico(regiao){
  const v = SERIE[regiao], W=640, H=220, pl=36, pb=28, pt=12, n=v.length, max=8, bw=(W-pl-12)/n;
  const y = x => pt + (H-pt-pb)*(1 - x/max);
  const base = v.slice(n-10, n-3), mu = base.reduce((a,b)=>a+b,0)/base.length;
  const sd = Math.max(1, Math.sqrt(base.reduce((a,b)=>a+(b-mu)**2,0)/base.length)), lim = mu + 3*sd;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Casos por dia no ${regiao}, últimos ${n} dias, com o limite do método C2">`;
  for(let t=0;t<=max;t+=2) s += `<line x1="${pl}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${t}</text>`;
  v.forEach((c,i)=>{ const x=pl+i*bw+bw*.18, acima=c>lim;
    s += `<rect x="${x}" y="${y(c)}" width="${bw*.64}" height="${Math.max(0,y(0)-y(c))}" rx="4" fill="${acima?'var(--rust)':'var(--forest-2)'}"/>`;
    s += `<text x="${x+bw*.32}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${16+i}</text>`; });
  s += `<line x1="${pl}" x2="${W-6}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="8 6"/>`;
  s += `<text x="${W-8}" y="${y(lim)-6}" text-anchor="end" font-size="12" font-weight="700" fill="var(--rust)">limite ${lim.toFixed(1).replace('.',',')}</text></svg>`;
  return {svg:s, lim, hoje:v[n-1]};
}
function renderCentral(){

    <nav class="pnav" aria-label="Seções da central"><button data-ctab="vigilancia" ${tab==='vigilancia'?'aria-current="page"':''}>Vigilância</button><button data-ctab="cobertura" ${tab==='cobertura'?'aria-current="page"':''}>Postos críticos</button></nav></div><div class="pbody">`;
  if(tab==='vigilancia'){

  }
  $('#view').innerHTML = h + '</div></section>';
  renderNotas('central:'+tab);
}

// ---------- Eventos ----------
function render(){ ({posto:renderPosto, polo:renderPolo, central:renderCentral})[S.role](); }
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.role){ S.role=b.dataset.role; document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); return; }
  if(b.id==='net'){ S.online=!S.online; b.dataset.off=!S.online; b.setAttribute('aria-pressed',S.online); $('#net-label').textContent=S.online?'Com conexão':'Sem conexão';
    if(S.online && S.role==='posto'){ enviarFila(); toast('Conexão de volta. Dados sincronizados com os vizinhos.'); } render(); return; }
  if(b.dataset.ptab){ S.postoTab=b.dataset.ptab; render(); return; }
  if(b.dataset.polotab){ S.poloTab=b.dataset.polotab; render(); return; }
  if(b.dataset.ctab){ S.centralTab=b.dataset.ctab; render(); return; }
  const act = b.dataset.act;
  if(act==='receber'){ const r=S.remessaChegando, q=Math.max(0, +$('#qtd-receb').value||0);
    S.lotes.push({id:r.lote, soro:r.soro, val:r.val, qtd:q, bloq:false}); r.recebida=true;
    toast(q===r.qtd ? `Recebimento de ${q} amp. confirmado.` : `Recebidas ${q} de ${r.qtd} amp. A divergência vai para o polo.`); render(); }
  if(act==='perda') formPerda(b.dataset.lote);
  if(act==='perda-cancela') $('#perda-area').innerHTML='';
  if(act==='perda-ok'){ const l=S.lotes.find(x=>x.id===b.dataset.lote), m=$('#perda-motivo').value, q=Math.min(l.qtd, Math.max(1,+$('#perda-qtd').value||1));
    if(m==='frio'){ l.bloq=true; toast(`Lote ${l.id} bloqueado até a avaliação da rede de frio.`); } else { l.qtd-=q; toast(`Perda de ${q} amp. registrada no lote ${l.id}.`); } render(); }
  if(act==='avisar') toast('Aviso de encaminhamento guardado. Chega a Benjamin Constant na próxima sincronização.');
  if(act==='ciente'){ S.alertas.find(a=>a.id===b.dataset.id).ciente=true; render(); }
  if(act==='sync'){ if(S.online){ enviarFila(); toast('Sincronizado com Benjamin Constant e Tabatinga.'); render(); } else toast('Sem conexão agora. Os dados continuam guardados neste aparelho.'); }
  if(act==='enviar'){ const u=S.regiao.find(x=>x.nome===b.dataset.posto), q=+b.dataset.qtd; u.transito+=q; S.enviadosPolo.push({posto:u.nome, qtd:q}); toast(`Remessa de ${q} amp. registrada para ${u.nome}.`); render(); }
  if(act==='copiar'){ const t=$('#csv').textContent;
    const sel=()=>{const r=document.createRange(); r.selectNodeContents($('#csv')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto selecionado. Use Ctrl+C para copiar.');};
    try{ navigator.clipboard.writeText(t).then(()=>toast('Lista copiada.'), sel); }catch(_){ sel(); } }
});
render();
</script>
