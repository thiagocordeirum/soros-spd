<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soro · Rede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header></header>
<main>
  <section class="grade">
    <div class="bloco">
      <div class="cab"><h2>Vizinhos</h2><button class="botao peq" id="agora">Sincronizar agora</button></div>
      <div class="tabela" id="vizinhos"></div>
    </div>
    <div class="bloco">
      <h2>Vetor de versões</h2>
      <p class="leve">Quantos registros de cada unidade este nó já tem. Dois nós com o mesmo vetor têm os mesmos dados.</p>
      <div class="tabela" id="vetor"></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
async function carregar() {
  const s = await App.api("/api/sincronizacao");
  const m = s.metricas;
  const vivos = s.vizinhos.filter(v => !v.erro && v.ultimo_ok_ha_s !== null).length;
  App.heroTexto(`${App.milhar(s.eventos)} registros`,
    `Resumo *${s.resumo}*. *${vivos} de ${s.vizinhos.length}* vizinhos respondendo. Dois nós com o mesmo resumo têm exatamente os mesmos dados.`);
  $("h-ok-v").textContent = App.milhar(m.trocas_ok);
  $("h-falhas-v").textContent = App.milhar(m.trocas_falhas);
  $("h-viz-v").textContent = `${vivos}/${s.vizinhos.length}`;
  $("vizinhos").innerHTML = `<table><tr><th>Vizinho</th><th>Última troca</th><th>Situação</th></tr>
    ${s.vizinhos.map(v => `<tr><td>${App.esc(v.nome)}</td><td>${v.ultimo_ok_ha_s === null ? "nunca" : `há ${v.ultimo_ok_ha_s} s`}</td>
      <td>${v.erro ? `<span class="etq aviso">sem resposta</span>` : '<span class="etq ok">ok</span>'}</td></tr>`).join("")}</table>`;
  $("vetor").innerHTML = `<table><tr><th>Unidade de origem</th><th class="d">Registros</th></tr>
    ${Object.entries(s.vetor).sort().map(([o, n]) => `<tr><td>${App.esc(App.info.unidades[o]?.nome || o)}</td><td class="d num">${n}</td></tr>`).join("")}</table>`;
}
(async () => {
  await App.cabecalho("rede.html");
  App.hero({rotulo: "Registros neste nó", titulo: "...", texto: "", acoes: [
    {icone: "sincronizar", rotulo: "Sincronizar agora", curto: "Sincronizar", id: "sinc-agora"},
    {icone: "rede", rotulo: "Vizinhos ativos", valor: "-", id: "h-viz", href: "#vizinhos", cor: "azul"},
    {icone: "ok", rotulo: "Trocas com sucesso", valor: "-", id: "h-ok", href: "#vetor", cor: "ambar"},
    {icone: "alerta", rotulo: "Trocas que falharam", valor: "-", id: "h-falhas", href: "#vizinhos", cor: "laranja"}]});
  $("sinc-agora").addEventListener("click", () => $("agora").click());
  $("agora").addEventListener("click", async () => {
    const r = await App.api("/api/sincronizar", {});
    const ok = Object.values(r.resultado).filter(Boolean).length;
    App.aviso(`Sincronizado com ${ok} de ${Object.keys(r.resultado).length} vizinhos.`);
    carregar();
  });
  await carregar();
  setInterval(carregar, 3000);
})().catch(e => App.aviso(e.message, true));
</script>
</body>
</html>
