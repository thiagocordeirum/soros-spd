<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soro · Painel do polo</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header></header>
<main>
  <section class="bloco">
    <div class="cab"><h2>Reposição dos postos</h2><span class="leve">conta o que o posto tem, o que já está a caminho e quanto cabe na geladeira</span></div>
    <div class="tabela" id="sugestoes"></div>
  </section>
  <section class="bloco">
    <div class="cab"><h2>Estoque dos postos e estoque-alvo</h2>
      <label style="flex-direction:row;align-items:center;gap:8px">Soro <select id="soro-alvo" style="width:auto"></select></label></div>
    <div id="alvos"></div>
  </section>
  <section class="grade">
    <div class="bloco"><h2>Pedidos dos postos</h2><div id="pedidos"></div></div>
    <div class="bloco"><h2>Remessas enviadas a caminho</h2><div id="enviadas"></div></div>
  </section>
  <section class="bloco">
    <div class="cab"><h2>Unidades da região</h2><span class="leve">segundo a última informação de cada uma</span></div>
    <div class="tabela" id="unidades"></div>
  </section>
  <section id="vigilancia"></section>
  <section class="grade" id="graficos"></section>
</main>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
let ultimoG = null;
const desenharGraficos = () => { if (ultimoG) $("graficos").innerHTML = App.graficosGerais(ultimoG, {W: App.larguraBloco($("graficos"))}); };
let sugestoes = [];

function desenharAlvos() {
  const soro = $("soro-alvo").value, cor = App.corSoro(soro);
  const linhas = sugestoes.filter(s => s.soro === soro).map(s => ({rotulo: s.nome, marca: s.alvo, texto: `${s.tem + s.a_caminho} de ${s.alvo}`,
    segs: [{nome: "em estoque", valor: s.tem, cor}, {nome: "a caminho", valor: s.a_caminho, cor: "var(--tinta3)"}]}));
  $("alvos").innerHTML = linhas.length ? App.legenda([{nome: "em estoque", cor}, {nome: "a caminho", cor: "var(--tinta3)"}, {nome: "estoque-alvo", cor: "var(--tinta)", forma: "risco"}])
    + `<div class="grafico">${App.barras({linhas, unidade: "amp.", W: App.larguraBloco($("alvos"), false)})}</div>`
    + App.tabelaDados(["Posto", "Em estoque", "A caminho", "Alvo"], linhas.map(l => [l.rotulo, l.segs[0].valor, l.segs[1].valor, l.marca]))
    : '<p class="vazio">Nenhum posto trabalha com este soro.</p>';
}

async function enviar(destino, soro, qtd, pedido) {
  try {
    await App.api("/api/remessas", {destino, soro, qtd, pedido});
    App.aviso(`Remessa de ${qtd} amp. registrada. O destino confirma quando chegar.`);
    carregar();
  } catch (err) { App.aviso(err.message, true); }
}

async function carregar() {
  const [sug, rem, painel, vig, g] = await Promise.all([App.api("/api/sugestoes"), App.api("/api/remessas"),
    App.api("/api/painel"), App.api("/api/vigilancia"), App.api("/api/graficos")]);
  sugestoes = sug;
  desenharAlvos();
  ultimoG = g;
  desenharGraficos();
  $("sugestoes").innerHTML = `<table><tr><th>Posto</th><th>Soro</th><th class="d">Tem</th><th class="d">A caminho</th>
    <th class="d">Cabe</th><th class="d">Alvo</th><th class="d">Enviar</th><th>Informação</th><th></th></tr>
    ${sug.map(s => `<tr><td>${App.esc(s.nome)}</td><td>${s.soro}</td><td class="d num">${s.tem}</td><td class="d num">${s.a_caminho}</td>
      <td class="d num">${s.cabe}</td><td class="d num">${s.alvo}</td>
      <td class="d"><b class="num">${s.sugestao || "-"}</b><br><span class="leve">${s.motivo}</span></td>
      <td>${App.etiquetaIdade(s.atualizado_ha_s)}</td>
      <td>${s.sugestao ? `<button class="botao peq" data-d="${s.unidade}" data-s="${s.soro}" data-q="${s.sugestao}">Enviar</button>` : ""}</td></tr>`).join("")}</table>`;
  $("pedidos").innerHTML = rem.pedidos_recebidos.length ? rem.pedidos_recebidos.map(p => `<div class="lote">
      <span>${App.esc(App.info.unidades[p.unidade].nome)}: ${p.qtd} amp. de ${App.esc(App.soro(p.soro))} (${App.data(p.data)})</span>
      <button class="botao peq" data-d="${p.unidade}" data-s="${p.soro}" data-q="${p.qtd}" data-p="${p.id}">Atender</button></div>`).join("")
    : '<p class="vazio">Nenhum pedido em aberto.</p>';
  $("enviadas").innerHTML = rem.enviadas.length ? rem.enviadas.map(r => `<div class="lote">
      <span>${r.qtd} amp. de ${r.soro} para ${App.esc(App.info.unidades[r.destino].nome)}</span><span class="etq aviso">desde ${App.data(r.data)}</span></div>`).join("")
    : '<p class="vazio">Nenhuma remessa a caminho.</p>';
  $("unidades").innerHTML = `<table><tr><th>Unidade</th><th>Antibotrópico</th><th>Geladeira</th><th class="d">A caminho</th><th>Informação</th></tr>
    ${painel.unidades.map(u => { const sab = u.soros.find(s => s.soro === "SAB") || {estoque: 0}; const oc = (u.total + u.a_caminho) / u.capacidade;
      return `<tr><td>${App.esc(u.nome)}</td><td class="num">${sab.estoque} amp.</td>
        <td><div class="barra"><span class="${oc > .85 ? "cheio" : ""}" style="width:${Math.min(100, oc * 100)}%"></span></div><span class="leve num">${u.total + u.a_caminho} de ${u.capacidade}</span></td>
        <td class="d num">${u.a_caminho || "-"}</td><td>${App.etiquetaIdade(u.atualizado_ha_s)}</td></tr>`; }).join("")}</table>`;
  $("vigilancia").innerHTML = vig.map(v => `<div class="bloco ${v.alertas.length ? "aviso" : ""}">
      <div class="cab"><h2>Casos por dia · ${App.esc(v.regiao)}</h2>
      <span class="etq ${v.alertas.length ? "aviso" : "ok"}">${v.alertas.length ? "surto: alerta enviado à região" : "dentro do normal"}</span></div>
      <div class="grafico">${App.grafico(v.serie)}</div>
      <p class="leve">Barras: casos registrados por dia. Tracejado: limite (média dos 7 dias que terminam 3 dias antes, mais três desvios).</p></div>`).join("");
}

(async () => {
  const i = await App.cabecalho("polo.html");
  $("soro-alvo").innerHTML = Object.entries(i.soros).map(([k, n]) => `<option value="${k}">${App.esc(n)}</option>`).join("");
  $("soro-alvo").addEventListener("change", desenharAlvos);
  App.aoRedimensionar(() => { desenharAlvos(); desenharGraficos(); });
  document.querySelector("main").addEventListener("click", e => {
    const b = e.target.closest("button[data-d]");
    if (b) enviar(b.dataset.d, b.dataset.s, +b.dataset.q, b.dataset.p || null);
  });
  await carregar();
  setInterval(carregar, 10000);
})().catch(e => App.aviso(e.message, true));
</script>
</body>
</html>
