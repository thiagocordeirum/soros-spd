<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soro · Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header></header>
<main>
  <section class="grade">
    <div class="bloco" id="alertas"><h2>Alertas de surto</h2><p class="vazio">Carregando...</p></div>
    <div class="bloco">
      <h2>Como funciona</h2>
      <div class="lista" id="como"></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
<script>
(async () => {
  const i = await App.cabecalho("index.html");
  const [est, alertas, cont] = await Promise.all([App.api("/api/estoque"), App.api("/api/alertas"), App.api("/api/contagem")]);
  const acoes = [];
  if (i.nivel !== "estado") acoes.push({icone: "frasco", rotulo: "Atender", href: "posto.html#f-caso"}, {icone: "estoque", rotulo: "Estoque", href: "posto.html#estoque", cor: "azul"});
  if (i.nivel === "polo" && App.pode("paineis")) acoes.push({icone: "caminhao", rotulo: "Repor postos", href: "polo.html", cor: "ambar"});
  if (i.nivel === "estado") acoes.push({icone: "painel", rotulo: "Painel", href: "estado.html"}, {icone: "alerta", rotulo: "Vencendo", href: "estado.html#vencendo", cor: "ambar"});
  acoes.push({icone: "pin", rotulo: "Onde tem soro", href: "usuario.html", cor: "laranja"}, {icone: "rede", rotulo: "Rede", href: "rede.html", cor: "azul"});
  App.hero({rotulo: "Estoque desta unidade", titulo: `${App.milhar(est.total)} ampolas`,
    texto: `*${est.livre} lugares livres* na geladeira, ${est.a_caminho.length ? `*${est.a_caminho.length} remessa(s)* chegando` : "nenhuma remessa chegando"} e *${App.milhar(cont.casos)} casos* conhecidos na rede.`,
    acoes: acoes.slice(0, 4)});
  document.getElementById("alertas").innerHTML = "<h2>Alertas de surto</h2>" + (alertas.length
    ? `<div class="lista">${alertas.map(a => `<div class="item"><span class="ic laranja">${App.icone("sino")}</span>
        <p><b>Surto no ${App.esc(a.regiao)}</b><br><span class="leve">${a.observado} casos em ${App.data(a.dia)}; o normal da região fica abaixo de ${String(a.limiar).replace(".", ",")}.</span></p></div>`).join("")}</div>`
    : `<p class="vazio">Nenhum alerta ativo.</p>`);
  document.getElementById("como").innerHTML = [
    ["rede", "", "Este nó guarda uma cópia dos dados e continua funcionando se a secretaria ou o polo sair do ar."],
    ["sincronizar", "azul", "A cada 2 segundos ele troca o que há de novo com as unidades vizinhas."],
    ["relogio", "ambar", "Toda informação de outra unidade mostra há quanto tempo chegou."],
  ].map(([ic, cor, t]) => `<div class="item"><span class="ic ${cor}">${App.icone(ic)}</span><p>${t}</p></div>`).join("");
})().catch(e => App.aviso(e.message, true));
</script>
</body>
</html>
