<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E5EEEA">
<title>Seu perfil · Onde tem soro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<style>
main>*,.hero{max-width:720px}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 20px;margin:0}
.ficha div{padding:10px 0;border-bottom:1px solid var(--linha)}
.ficha dt{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.ficha dd{margin:2px 0 0;font-size:17px;font-weight:600}
.ficha dd.alerta{color:var(--ruim)}
.botoes{display:flex;flex-wrap:wrap;gap:10px}
textarea{border:1.5px solid var(--linha);background:var(--sup);color:var(--tinta);border-radius:var(--r-sm);padding:11px 12px;width:100%;font:inherit;min-height:70px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
legend{font-size:13px;font-weight:600;color:var(--tinta3);margin-bottom:6px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcoes label{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--tinta);background:var(--sup);border:1.5px solid var(--linha);border-radius:999px;padding:8px 14px;cursor:pointer}
.opcoes input{width:auto;accent-color:var(--verde)}
.opcoes label:has(input:checked){border-color:var(--verde);background:var(--t-verde-f)}
</style>
</head>
<body>
<header class="topo cidadao">
  <div class="quem"><h1>Seu perfil</h1><small>Opcional · fica só neste aparelho</small></div>
  <div class="dir"><a class="avatar" href="usuario.html" title="Voltar para a busca de soro" id="voltar"></a></div>
</header>
<section class="hero">
  <div class="hero-card"><small id="rotulo">Mostre à equipe de saúde</small><h2 id="titulo">Seu perfil</h2>
    <div class="hero-botoes"><a class="hero-botao emergencia" href="tel:192" id="ligar"></a></div></div>
</section>
<main>
  <section class="abertura"><p class="frase">Estes dados <b>não vão para a rede</b> nem para nenhum servidor. Ficam guardados <b>só neste celular</b>, para você mostrar na tela ao chegar ao atendimento.</p></section>

  <section class="bloco" id="cartao" hidden>
    <dl class="ficha" id="ficha"></dl>
    <div class="botoes">
      <button class="botao" type="button" id="editar">Editar</button>
      <a class="botao sec" href="usuario.html" style="text-decoration:none">Procurar soro</a>
      <button class="botao sec" type="button" id="apagar">Apagar perfil</button>
    </div>
  </section>

  <form class="bloco" id="f-perfil" hidden>
    <h2>Seus dados</h2>
    <div class="campos">
      <label>Nome<input name="nome" autocomplete="name"></label>
      <label>Data de nascimento<input name="nascimento" type="date"></label>
    </div>
    <div class="campos">
      <label>Telefone<input name="telefone" type="tel" autocomplete="tel" inputmode="tel"></label>
      <label>Comunidade ou município<input name="lugar" autocomplete="address-level2"></label>
    </div>
    <fieldset>
      <legend>Já tomou soro antiveneno alguma vez?</legend>
      <div class="opcoes">
        <label><input type="radio" name="soro_antes" value="nao">Não</label>
        <label><input type="radio" name="soro_antes" value="sim">Sim</label>
        <label><input type="radio" name="soro_antes" value="nao_sei">Não sei</label>
      </div>
    </fieldset>
    <label>Se tomou: quando, e se teve alguma reação<input name="soro_quando" placeholder="ex.: 2019, picada de jararaca, sem reação"></label>
    <label>Alergias<textarea name="alergias" placeholder="Remédios, alimentos, picadas"></textarea></label>
    <label>Doenças e remédios de uso contínuo<textarea name="saude" placeholder="ex.: pressão alta, diabetes, anticoagulante"></textarea></label>
    <div class="campos">
      <label>Contato de emergência<input name="contato_nome" placeholder="Nome"></label>
      <label>Telefone do contato<input name="contato_tel" type="tel" inputmode="tel"></label>
    </div>
    <div class="botoes">
      <button class="botao" type="submit">Salvar neste celular</button>
      <button class="botao sec" type="button" id="cancelar">Cancelar</button>
    </div>
  </form>
</main>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
const CHAVE = "soro-perfil";
const SORO_ANTES = {nao: "Não", sim: "Sim", nao_sei: "Não sabe"};
const CAMPOS = [["nome", "Nome"], ["nascimento", "Nascimento"], ["telefone", "Telefone"], ["lugar", "Comunidade ou município"],
  ["soro_antes", "Já tomou soro antiveneno"], ["soro_quando", "Quando e reação"], ["alergias", "Alergias"],
  ["saude", "Doenças e remédios"], ["contato", "Contato de emergência"]];

function ler() {
  try { return JSON.parse(localStorage.getItem(CHAVE)) || null; } catch (e) { return null; }
}

function idade(nasc) {
  const d = new Date(nasc + "T12:00"), h = new Date();
  return h.getFullYear() - d.getFullYear() - (h < new Date(h.getFullYear(), d.getMonth(), d.getDate()) ? 1 : 0);
}

function mostrar() {
  const p = ler();
  $("cartao").hidden = !p;
  $("f-perfil").hidden = !!p;
  $("titulo").textContent = p?.nome || "Seu perfil";
  if (!p) return;
  const valor = {
    ...p,
    nascimento: p.nascimento ? `${App.data(p.nascimento)} (${idade(p.nascimento)} anos)` : "",
    soro_antes: SORO_ANTES[p.soro_antes] || "",
    contato: [p.contato_nome, p.contato_tel].filter(Boolean).join(" · "),
  };
  $("ficha").innerHTML = CAMPOS.filter(([k]) => valor[k]).map(([k, rotulo]) =>
    `<div><dt>${rotulo}</dt><dd class="${k === "alergias" || (k === "soro_antes" && p.soro_antes === "sim") ? "alerta" : ""}">${App.esc(valor[k])}</dd></div>`).join("")
    || '<p class="vazio">Perfil vazio.</p>';
}

function editar(rolar = true) {
  const p = ler() || {};
  const f = $("f-perfil");
  [...f.elements].forEach(el => {
    if (!el.name) return;
    if (el.type === "radio") el.checked = p[el.name] === el.value;
    else el.value = p[el.name] || "";
  });
  $("cartao").hidden = true;
  f.hidden = false;
  if (rolar) f.scrollIntoView({behavior: "smooth"});
}

$("voltar").innerHTML = App.icone("busca");
$("ligar").innerHTML = `${App.icone("telefone")}<span>Ligar 192</span>`;
$("editar").addEventListener("click", editar);
$("cancelar").addEventListener("click", mostrar);
$("apagar").addEventListener("click", () => {
  if (!confirm("Apagar o perfil deste celular?")) return;
  try { localStorage.removeItem(CHAVE); } catch (e) {}
  mostrar();
  editar();
});
$("f-perfil").addEventListener("submit", e => {
  e.preventDefault();
  const dados = Object.fromEntries(new FormData(e.target));
  Object.keys(dados).forEach(k => { dados[k] = dados[k].trim(); if (!dados[k]) delete dados[k]; });
  try {
    localStorage.setItem(CHAVE, JSON.stringify(dados));
  } catch (erro) {
    return App.aviso("Este navegador não deixou guardar o perfil (modo anônimo?).", true);
  }
  mostrar();
  window.scrollTo({top: 0, behavior: "smooth"});
});
mostrar();
if (!ler()) editar(false);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
